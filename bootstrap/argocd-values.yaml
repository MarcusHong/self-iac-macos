# ================================================
# Argo CD Helm Values (chart 10.10.5 / Argo CD v3.5.5)
# builders-starter-iac의 Argo CD 구성을 따른다.
#
# 비밀번호 없이 운영: 익명 사용자에게 admin 권한을 주고 admin 계정은 끈다.
# 대신 LAN에 노출하지 않는다 (Ingress 없음). 02-k8s.sh가 설정:
#   127.0.0.1:8080 kubectl port-forward (LaunchAgent) → Tailscale Serve https://<TS_HOSTNAME>:8443 (tailnet 전용)
# (configs.cm.url은 02-k8s.sh가 tailnet 주소로 주입)
# ================================================

dex:
  enabled: false

applicationSet:
  replicas: 0

# 컨트롤러만 활성화 — notifier 자격증명, trigger/template, 구독은 별도 설정
notifications:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

configs:
  cm:
    timeout.reconciliation: 60s
    url: http://localhost:8080
    users.anonymous.enabled: "true"
    admin.enabled: "false"
  rbac:
    policy.default: role:admin
  params:
    # port-forward로 HTTP 접속 (TLS 없음)
    server.insecure: true
    # 서비스 배포 OCI 아티팩트(ORAS tar / tar+gzip)와 Helm OCI 차트
    reposerver.oci.layer.media.types: application/vnd.oci.image.layer.v1.tar,application/vnd.oci.image.layer.v1.tar+gzip,application/vnd.cncf.helm.chart.content.v1.tar+gzip

# ── 단일 노드 리소스 ──
server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
