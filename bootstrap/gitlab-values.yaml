# ================================================
# GitLab CE Helm Values (chart 10.5.0 / GitLab 19.5.0)
# 호스트 PostgreSQL 18 + Valkey + Garage(S3)
# INSTALL_GITLAB=true 일 때만 02-k8s.sh가 사용
# ================================================

global:
  edition: ce
  hosts:
    # TS_HOSTNAME으로 치환됨 (02-k8s.sh)
    domain: TS_HOSTNAME_PLACEHOLDER
    gitlab:
      name: TS_HOSTNAME_PLACEHOLDER
    # 외부 URL은 HTTPS지만, Ingress 단에서 TLS는 Traefik이 처리
    https: true
    registry:
      name: TS_HOSTNAME_PLACEHOLDER
      https: true

  # 차트 10.x(GitLab 19)부터 기본값이 Gateway API + Envoy Gateway — Traefik Ingress로 되돌림
  gatewayApi:
    enabled: false
    installEnvoy: false

  ingress:
    enabled: true
    provider: traefik
    configureCertmanager: false
    class: traefik
    tls:
      enabled: false

  # ── 외부 PostgreSQL (호스트) ──
  psql:
    host: host.docker.internal
    port: 5432
    username: gitlab
    password:
      secret: gitlab-postgres-secret
      key: password
    database: gitlab

  # ── 외부 Valkey (호스트) ──
  redis:
    host: host.docker.internal
    port: 6379
    auth:
      enabled: false

  # ── SMTP (Gmail) ──
  smtp:
    enabled: SMTP_ENABLED_PLACEHOLDER
    address: smtp.gmail.com
    port: 587
    authentication: plain
    user_name: SMTP_USER_PLACEHOLDER
    password:
      secret: gitlab-smtp-secret
      key: password
    starttls_auto: true
  email:
    from: SMTP_USER_PLACEHOLDER
    reply_to: SMTP_USER_PLACEHOLDER

  kas:
    enabled: false

  # ── API Rate Limit 완화 (LLM 자동화용) ──
  appConfig:
    applicationSettingsCacheSeconds: 60

    # ── 오브젝트 스토리지 (호스트 Garage, Secret은 02-k8s.sh가 생성) ──
    # host.docker.internal은 클러스터 밖(브라우저, git-lfs)에서 접근할 수 없으므로 다운로드는 GitLab이 프록시
    object_store:
      enabled: true
      proxy_download: true
      connection:
        secret: gitlab-object-storage
        key: connection
    # 01-data.sh가 만드는 버킷 이름 (lfs/terraformState/backups.tmpBucket은 차트 기본값과 다름)
    artifacts:
      bucket: gitlab-artifacts
    uploads:
      bucket: gitlab-uploads
    packages:
      bucket: gitlab-packages
    lfs:
      bucket: gitlab-lfs
    terraformState:
      enabled: true
      bucket: gitlab-terraform
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-tmp

installCertmanager: false

certmanager-issuer:
  email: false

# ── 서브차트 비활성화 ──
# (차트 10.x에서 번들 PostgreSQL/Redis/MinIO 서브차트는 제거됨)
nginx-ingress:
  enabled: false

prometheus:
  install: false

# ── GitLab Runner ──
gitlab-runner:
  install: true
  gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8080
  runners:
    privileged: true
    # 차트는 이 Secret의 accesskey/secretkey를 CACHE_S3_ACCESS_KEY/SECRET_KEY로 내보내기만 함
    # 나머지 캐시 설정은 아래 config의 [runners.cache]에 둬야 적용됨
    cache:
      secretName: gitlab-runner-cache-secret
    config: |
      [[runners]]
        [runners.kubernetes]
          namespace = "gitlab"
          image = "ubuntu:26.04"
          privileged = true
        [runners.cache]
          Type = "s3"
          Shared = true
          [runners.cache.s3]
            ServerAddress = "host.docker.internal:3900"
            BucketName = "gitlab-runner-cache"
            BucketLocation = "garage"
            Insecure = true
            AuthenticationType = "access-key"

# ── GitLab 컴포넌트 리소스 ──
gitlab:
  webservice:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1200Mi
      limits:
        cpu: 1500m
        memory: 2Gi
    workerProcesses: 1

  sidekiq:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    concurrency: 20
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  gitaly:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    persistence:
      enabled: true
      size: 50Gi

  gitlab-shell:
    enabled: false

  toolbox:
    replicas: 1
    backups:
      cron:
        enabled: true
        schedule: "0 4 * * *"
        extraArgs: "--skip artifacts"
      # backup-utility는 s3cmd 설정 파일을 읽음 (fog 연결 형식 아님)
      objectStorage:
        config:
          secret: gitlab-object-storage-s3cmd
          key: config
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  kas:
    enabled: false

  gitlab-pages:
    enabled: false

# ── Registry (LoadBalancer, Ingress 미사용) ──
registry:
  enabled: true
  replicas: 1
  hpa:
    minReplicas: 1
    maxReplicas: 1
  ingress:
    enabled: false
  service:
    type: LoadBalancer
  storage:
    secret: gitlab-registry-storage
    key: config
    # docker 클라이언트가 host.docker.internal로 리다이렉트되지 않도록 Registry가 직접 전달
    redirect:
      disable: true
  maintenance:
    gc:
      disabled: false
      schedule: "0 5 * * 0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
