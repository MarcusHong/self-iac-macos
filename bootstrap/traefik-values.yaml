# ================================================
# Traefik Helm Values (chart 42.0.0 / Traefik v3.7.14)
# TLS 종단 + HTTP→HTTPS 리다이렉트
# ================================================

service:
  spec:
    type: LoadBalancer

# 컨테이너는 non-root(8000/8443)로 리슨하고 Service에서 80/443으로 노출
ports:
  web:
    exposedPort: 80
    # HTTP→HTTPS 리다이렉트
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    exposedPort: 443

tlsStore:
  default:
    defaultCertificate:
      secretName: tailscale-tls

ingressRoute:
  dashboard:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
