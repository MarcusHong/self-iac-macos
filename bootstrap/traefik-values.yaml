# ================================================
# Traefik Helm Values (chart 42.0.0 / Traefik v3.7.14)
# TLS 종단 + HTTP→HTTPS 리다이렉트
# ================================================

service:
  spec:
    type: LoadBalancer

# 컨테이너는 non-root(8000/8443/5050)로 리슨하고 Service에서 80/443/5050으로 노출
# web/websecure를 기본 엔트리포인트로 지정 — entrypoints 어노테이션이 없는 Ingress는 여기에만 붙음
ports:
  web:
    asDefault: true
    exposedPort: 80
    # HTTP→HTTPS 리다이렉트
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    exposedPort: 443
  # GitLab Container Registry 전용 (GitLab과 같은 Tailscale 호스트, macOS AirPlay가 쓰는 5000은 피함)
  registry:
    port: 5050
    exposedPort: 5050
    expose:
      default: true
    protocol: TCP
    http:
      tls:
        enabled: true

tlsStore:
  default:
    defaultCertificate:
      secretName: tailscale-tls

ingressRoute:
  dashboard:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
