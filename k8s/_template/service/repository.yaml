# 자격증명 없는 repository 등록 — private 레지스트리의 pull 자격증명은
# docs/argocd.md의 repo-creds Secret이 URL prefix 매칭으로 공급합니다.
apiVersion: v1
kind: Secret
metadata:
  name: repo-CHANGEME-deploy
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: CHANGEME-deploy
  project: apps
  type: oci
  # 예: oci://registry.example.com/group/api-deploy
  url: oci://CHANGEME
